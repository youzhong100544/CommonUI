<html lang="en">

		<title> Blog Test </title>

		<link rel="stylesheet" type="text/css" href="../../../css/CommonUI.css"/>
		<!-- 
			script标签之type=“module“
			https://blog.csdn.net/m0_54070657/article/details/137278669
		
			使用 <script> 标签加载 JavaScript 文件时，通常有两种方式：

				传统方式
					<script src="script.js"></script>

				模块化方式
					<script type="module" src="script.js"></script>

			两种方式的主要区别：
				传统方式：
					当浏览器遇到传统的 <script> 标签时，会立即加载并执行其中的 JavaScript 代码。
					这意味着代码中的全局变量和函数都会污染全局作用域，可能导致命名冲突和变量覆盖等问题。
				模块化方式：
					使用 type="module" 属性告诉浏览器，这个 <script> 标签中的 JavaScript 代码是一个模块。
					浏览器会按照模块化的方式去加载和执行这段代码，包括解析依赖关系、异步加载等。
					模块具有自己的作用域，模块内部的变量和函数不会污染全局作用域，也不会受到其他模块的影响。
		-->
		<!-- <script type="text/javascript" src="../../../js/CommonUI.js"></script> -->
		<script type="module" src="../../../js/CommonUI.js"></script>
		
	</head>
	<body>
		<div id="CommonUI-Blog-app" class="CommonUI-Blog-app" data-theme="default">
			Blog
		</div>
	</body>
</html>
