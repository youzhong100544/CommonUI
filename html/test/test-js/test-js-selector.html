<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="ie=edge">
		<title>test-js-selector</title>

		<!-- <link rel="stylesheet" href="style.css"> -->
		<!-- <script src="index.js"></script> -->

		<style>
			* {margin: 0; padding: 0; box-sizing: border-box;}

			#id-selector {
				width: 200px;
				height: 150px;
				background-color: red;
			}

			#id-selector span {
				/* 
					必须加上display:block;否则不能居中显示，因为span是行内元素
					必须转换成块元素才会居中显示生效。
				*/
				/* 水平居中: text-align: center; */
				/* 垂直居中: line-height：值为span的高度; */

				display: block;

				/* width: 100%; */
				/* height: 50px; */
				border: 1px solid black;

				text-align: center;
			}

			#id-selector button {
				/* 
					button 是 inline-block 元素 
					特点：
						综合块级元素与行内元素的特性，可设宽高(默认是内容宽高)，也可以设置内外边距
				*/
				/* display: block; */

				/* 
					margin 属性为给定元素设置所有四个（上右下左）方向的外边距属性。
					也就是 margin-top、margin-right、margin-bottom 和 margin-left 四个外边距属性设置的简写。

					应用于所有边
					margin: 1em;
					margin: -3px;

					上边下边 | 左边右边
					margin: 5% auto;

					上边 | 左边右边 | 下边
					margin: 1em auto 2em;

					上边 | 右边 | 下边 | 左边
					margin: 2px 1em 0 auto;

					全局值
					margin: inherit;
					margin: initial;
					margin: unset;
				*/
				/* margin: 0 auto; */
				margin: auto;
			}
	
		</style>
	
		<script>
			/** 
			 * 使用Math.random()生成随机RGB颜色
			 * 
			 * Math.random()是JavaScript中生成随机数的基础方法，通过该方法我们可以生成范围在0到255之间的三个随机整数，分别代表RGB颜色模型中的红、绿、蓝三个通道的值。
			 * 然后将这些值转换成十六进制字符串并组合成CSS颜色表示法。
			 * 
			 * 实现步骤：
			 *     生成三个0到255之间的随机整数。
			 * 	   将这些整数转换为两位的十六进制字符串。
			 * 	   将这些字符串组合成一个有效的CSS颜色字符串。
			 * 
			 * 详细描述：
			 * 	   1. 生成随机整数：Math.random() * 256生成一个0到255之间的浮点数，通过Math.floor()将其向下取整，得到0到255之间的整数。
			 * 	   2. 转换为十六进制字符串：toString(16)方法将整数转换为十六进制字符串，padStart(2, '0')确保每个通道的值始终为两位长度（不足两位前面补0）。
			 * 	   3. 组合成CSS颜色字符串：使用模板字符串将三个十六进制字符串组合成一个CSS颜色表示法。
			 */
			function getRandomColor() {
				const r = Math.floor(Math.random() * 256).toString(16).padStart(2, '0');
				const g = Math.floor(Math.random() * 256).toString(16).padStart(2, '0');
				const b = Math.floor(Math.random() * 256).toString(16).padStart(2, '0');
				return `#${r}${g}${b}`;
			}

			window.onload = function () {

				var btn = document.getElementById("id-selector-button");  
				btn.onclick = function(){  
					let testIdSelector_01 = document.getElementById("id-selector");
					testIdSelector_01.style.backgroundColor = getRandomColor();  
				}

			}

			function buttonClick() {  
				// alert("你点击了按钮哦"); 
				let testIdSelector_01 = document.getElementById("id-selector");
				
				// testIdSelector_01.style.backgroundColor = "gray";

				testIdSelector_01.style.backgroundColor = getRandomColor();
			}

			function buttonClick1(idName) {  
				// alert("你点击了按钮哦"); 
				let testIdSelector_01 = document.getElementById(idName);
				
				// testIdSelector_01.style.backgroundColor = "gray";

				testIdSelector_01.style.backgroundColor = getRandomColor();
			}

			/** 测试 JS 方法重载 */
			function getElement() {  
				if (arguments.length === 1) {
					console.log('一个参数')
				}
				if (arguments.length === 2) {
					console.log('两个参数')
				}
			}
		</script>
	</head>
	<body>
		<h1>JS HTML DOM 选择器</h1>

		<div id="id-selector">
			<span style="">ID 选择器</span>
			<span>ID 选择器: 测试 1</span>

			<button value="点击修改背景颜色" onclick="buttonClick();">
				点击按钮1
			</button>

			<button value="点击修改背景颜色" onclick="buttonClick1('id-selector');">
				点击按钮2
			</button>

			<button id="id-selector-button" value="点击修改背景颜色">
				点击按钮3
			</button>
		</div>

	</body>
</html>
